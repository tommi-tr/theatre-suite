name: Diaframma · Windows installer

on:
  push:
    branches: [main, diaframma-dev]
    tags: ["diaframma-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: diaframma-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm -r typecheck

      - name: Build installer
        run: pnpm --filter diaframma tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Diaframma-Windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: Diaframma-Chrome-extension
          path: apps/diaframma/chrome-extension/
          if-no-files-found: error
          retention-days: 30

      - name: Rust tests
        run: cargo test -p diaframma --lib

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/diaframma-v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/*.exe
          draft: true
