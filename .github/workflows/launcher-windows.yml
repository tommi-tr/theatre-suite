name: Launcher · Windows installer

on:
  push:
    branches: [main, launcher-dev]
    tags: ["launcher-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Optional: a token that may write releases in the public repository (see docs/launcher/ARCHITECTURE.md).
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm -r typecheck

      - name: Rust tests (show model and launcher logic)
        run: cargo test -p theatre-project -p launcher-core

      - name: Build installer
        run: pnpm --filter launcher tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Theatre-Suite-Launcher-Windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/*.exe
          draft: true

      # The launcher's update check reads PUBLIC releases. While this repository is private,
      # installers are also published in the public releases repository, when the token exists.
      - name: Publish release in the public releases repository (tags only)
        if: startsWith(github.ref, 'refs/tags/launcher-v') && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tommi-tr/theatre-suite-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: target/release/bundle/nsis/*.exe
          draft: false
