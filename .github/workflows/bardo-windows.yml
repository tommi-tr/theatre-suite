name: Bardo · Windows installer

on:
  push:
    branches: [main, bardo-dev]
    tags: ["bardo-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bardo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      # Optional: a token that may write releases in the public repository tommi-tr/theatre-suite-releases.
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (all packages)
        run: pnpm -r typecheck

      - name: Tests (script model, pagination rules, exports)
        run: pnpm --filter bardo test

      - name: Build installer
        run: pnpm --filter bardo tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Bardo-Windows-installer
          path: target/release/bundle/nsis/Bardo_*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Rust tests
        run: cargo test -p bardo --lib

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/bardo-v')
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bundle/nsis/Bardo_*.exe
          draft: true

      # The launcher installs apps from the PUBLIC releases repository: publish the installer there too.
      - name: Publish release in the public releases repository (tags only)
        if: startsWith(github.ref, 'refs/tags/bardo-v') && env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: tommi-tr/theatre-suite-releases
          token: ${{ env.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: target/release/bundle/nsis/Bardo_*.exe
          draft: false
