[package]
name = "audio-engine"
version = "0.1.0"
description = "Theatre Suite — native audio engine (Diaframma, Cue): decoding, mixing, fades, output devices"
authors = ["Theatre Suite"]
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
parking_lot = "0.13.0"
cpal = "0.18.2"
symphonia = { version = "0.5.5", features = ["all"] }
rtrb = "0.4.1"
