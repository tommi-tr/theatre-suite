[package]
name = "granvelo"
version = "0.5.0"
description = "Granvelo — the lighting desk of a show: stage, lights, desk and memories (Theatre Suite)"
authors = ["Theatre Suite"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "granvelo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
suite-link = { path = "../../../crates/suite-link" }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
tauri-plugin-clipboard-manager = "2.5.0"

[target.'cfg(windows)'.dependencies]
# timeBeginPeriod while a DMX cable is connected (src/dmx/hires.rs); same version as the other apps.
windows = { version = "0.62.2", features = ["Win32_Media"] }
