[package]
name = "bardo"
version = "0.2.0"
description = "Bardo — writing scripts for the theatre (Theatre Suite)"
authors = ["Theatre Suite"]
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "bardo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
suite-link = { path = "../../../crates/suite-link" }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-clipboard-manager = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# PDF export straight from the page the user sees (WebView2 "PrintToPdf").
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }
windows-core = "0.62.2"
